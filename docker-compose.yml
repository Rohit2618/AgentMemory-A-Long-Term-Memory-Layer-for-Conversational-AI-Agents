# ============================================================================
# AgentMemory — full local stack: Postgres + Neo4j + FastAPI app.
# All images are free / open-source. Bring it up with:  docker compose up --build
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: agentmemory-postgres
    environment:
      POSTGRES_USER: agentmemory
      POSTGRES_PASSWORD: agentmemory
      POSTGRES_DB: agentmemory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmemory"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: agentmemory-neo4j
    environment:
      NEO4J_AUTH: neo4j/agentmemory
      # Community edition; disable strict validation noise for a smooth demo.
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: agentmemory-app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      # These override .env inside the container so services find each other.
      DATABASE_URL: postgresql+psycopg2://agentmemory:agentmemory@postgres:5432/agentmemory
      GRAPH_PROVIDER: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: agentmemory
      CHROMA_PERSIST_DIR: /app/.data/chroma
      # LLM + embeddings pulled from .env (see env_file below).
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/.data
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
  neo4jdata:
  appdata:
